  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

t:600;padding:6px 14px;font-size:12px;letter-spacing:.08em;text-transform:uppercase\">Example deal<\u002Fspan>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ notExample }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ onLoadExample }}\" style=\"border-radius:999px;white-space:nowrap;flex:none;height:44px;padding:0 14px;border:1.5px solid #008189;background:#fff;color:#008189;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap\" style-hover=\"text-decoration:underline\">Load example deal<\u002Fbutton>\n      <\u002Fsc-if>\n      <button sc-camel-on-click=\"{{ onClear }}\" style=\"border-radius:999px;white-space:nowrap;flex:none;height:44px;padding:0 14px;border:1.5px solid #008189;background:#fff;color:#008189;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap\" style-hover=\"text-decoration:underline\">Start new deal<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ onToggleGuide }}\" style=\"border-radius:999px;white-space:nowrap;flex:none;height:44px;padding:0 14px;border:1.5px solid #008189;background:#fff;color:#008189;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap\" style-hover=\"text-decoration:underline\">{{ guideToggleLabel }}<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<main style=\"flex:1;width:100%;max-width:1280px;margin:0 auto;padding:32px clamp(16px,4vw,40px) 56px;display:flex;flex-direction:column;gap:56px\">\n\n  <div data-noprint=\"1\" style=\"display:flex;flex-direction:column;gap:12px;background:#1a1a1a;color:#fff;border-radius:28px;padding:clamp(28px,5vw,56px)\">\n    <h1 style=\"margin:0;color:#fff;font-size:clamp(30px,5vw,48px);font-weight:600;letter-spacing:-.01em;line-height:1.15\">Structure a bridging deal<\u002Fh1>\n    <p style=\"margin:0;max-width:720px;color:#e6e6e6;font-size:17px;line-height:1.6;text-wrap:pretty\">Enter the deal to generate a live Indicative Quote, then submit it to CredX with your commentary. CredX provides unregulated principal bridging finance only.<\u002Fp>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ isExample }}\" hint-placeholder-val=\"{{ true }}\">\n    <div data-noprint=\"1\" style=\"border:1.5px solid #008189;border-radius:20px;padding:20px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 24px\">\n      <div style=\"display:flex;flex-direction:column;gap:4px;max-width:720px;flex:1 1 320px;min-width:0\">\n        <span style=\"font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#008189\">You are viewing an example deal<\u002Fspan>\n        <span style=\"min-width:0;text-wrap:pretty\">The form is filled with a sample deal so you can see how the portal works: a £200,000 net refinance over 12 months, secured on one property worth £400,000. Change any figure to watch the Indicative Quote update. When you are ready, start a new deal to clear the example and enter your own.<\u002Fspan>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ onClear }}\" style=\"border-radius:999px;white-space:nowrap;flex:none;flex:none;height:44px;padding:0 18px;border:1px solid #008189;background:#008189;color:#fff;font-weight:600;font-size:15px;cursor:pointer;white-space:nowrap\" style-hover=\"text-decoration:underline\">Clear example and start my deal<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ notExample }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-noprint=\"1\" style=\"border:1px solid #dfe3e6;border-radius:20px;padding:16px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px\">\n      <span style=\"flex:1 1 320px;min-width:0;color:#444\">Not sure where to start? Load the example deal to see a completed quote, then start a new deal when you are ready.<\u002Fspan>\n      <button sc-camel-on-click=\"{{ onLoadExample }}\" style=\"border-radius:999px;white-space:nowrap;flex:none;flex:none;height:40px;padding:0 16px;border:1.5px solid #008189;background:#fff;color:#008189;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap\" style-hover=\"text-decoration:underline\">Load example deal<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ hideGuide }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-noprint=\"1\" style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;border-top:1px solid #000;padding-top:12px\">\n      <span style=\"flex:1 1 260px;min-width:0;color:#444\">Need a reminder of the steps?<\u002Fspan>\n      <button sc-camel-on-click=\"{{ onToggleGuide }}\" style=\"border-radius:999px;white-space:nowrap;flex:none;height:44px;padding:0 18px;border:1.5px solid #008189;background:#fff;color:#008189;font-weight:600;font-size:14px;cursor:pointer\" style-hover=\"text-decoration:underline\">Show how to use the portal<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ showGuide }}\" hint-placeholder-val=\"{{ true }}\">\n    <section data-noprint=\"1\" style=\"display:flex;flex-direction:column;gap:16px\">\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:14px;border-top:1px solid #000;padding-top:12px\">\n        <h2 style=\"margin:0;flex:none;white-space:nowrap;color:#193243;font-size:17px;font-weight:600;letter-spacing:.06em;text-transform:uppercase\">How to use the portal<\u002Fh2>\n        <button sc-camel-on-click=\"{{ onToggleGuide }}\" style=\"border-radius:999px;white-space:nowrap;flex:none;flex:none;white-space:nowrap;height:44px;padding:0 12px;border:1.5px solid #008189;background:#fff;color:#008189;font-weight:600;font-size:13px;cursor:pointer\" style-hover=\"text-decoration:underline\">Hide guide<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:0 28px\">\n        <sc-for list=\"{{ guide }}\" as=\"g\" hint-placeholder-count=\"7\">\n          <a href=\"{{ g.href }}\" style=\"display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #e0e0e0;color:#000;text-decoration:none\" style-hover=\"text-decoration:underline\">\n            <span style=\"flex:none;font-size:13px;font-weight:600;color:#008189;margin-top:1px\">{{ g.num }}<\u002Fspan>\n            <span style=\"display:flex;flex-direction:column;gap:2px;min-width:0\"><span style=\"font-weight:600\">{{ g.title }}<\u002Fspan><span style=\"font-size:13px;color:#444;text-wrap:pretty\">{{ g.text }}<\u002Fspan><\u002Fspan>\n          <\u002Fa>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <div data-grid=\"1\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,500px),1fr));gap:48px;align-items:start\">\n\n    <div data-noprint=\"1\" style=\"display:flex;flex-direction:column;gap:48px;min-width:0\">\n\n      <!-- 1 BROKER -->\n      <section id=\"step1\" style=\"display:flex;flex-direction:column;gap:20px\">\n        <div style=\"display:flex;align-items:baseline;gap:14px;border-top:1px solid #000;padding-top:12px\">\n          <span style=\"font-size:13px;color:#008189;font-weight:600\">01<\u002Fspan>\n          <h2 style=\"margin:0;flex:none;white-space:nowrap;color:#193243;font-size:17px;font-weight:600;letter-spacing:.06em;text-transform:uppercase\">Broker details<\u002Fh2>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:16px 20px\">\n          <label style=\"display:flex;flex-direction:column;gap:6px;min-width:0\"><span style=\"font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#444\">Name<\u002Fspan><input value=\"{{ broker.name }}\" sc-camel-on-change=\"{{ on.bName }}\" autocomplete=\"name\" style=\"width:100%;height:44px;padding:0 12px;border:1px solid #b9c2c8;border-radius:10px;font-size:15px;background:#fff;color:#000;outline:none\" style-focus=\"border-color:#008189;box-shadow:0 0 0 3px rgba(0,129,137,.18)\"><\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px;min-width:0\"><span style=\"font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#444\">Firm<\u002Fspan><input value=\"{{ broker.firm }}\" sc-camel-on-change=\"{{ on.bFirm }}\" autocomplete=\"organization\" style=\"width:100%;height:44px;padding:0 12px;border:1px solid #b9c2c8;border-radius:10px;font-size:15px;background:#fff;color:#000;outline:none\" style-focus=\"border-color:#008189;box-shadow:0 0 0 3px rgba(0,129,137,.18)\"><\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px;min-width:0\"><span style=\"font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#444\">Email<\u002Fspan><input type=\"email\" value=\"{{ broker.email }}\" sc-camel-on-change=\"{{ on.bEmail }}\" autocomplete=\"email\" sc-camel-auto-capitalize=\"none\" sc-camel-spell-check=\"false\" style=\"width:100%;height:44px;padding:0 12px;border:1px solid #b9c2c8;border-radius:10px;font-size:15px;background:#fff;color:#000;outline:none\" style-focus=\"border-color:#008189;box-shadow:0 0 0 3px rgba(0,129,137,.18)\"><\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px;min-width:0\"><span style=\"font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#444\">Phone<\u002Fspan><input type=\"tel\" value=\"{{ broker.phone }}\" sc-camel-on-change=\"{{ on.bPhone }}\" autocomplete=\"tel\" style=\"width:100%;height:44px;padding:0 12px;border:1px solid #b9c2c8;border-radius:10px;font-size:15px;background:#fff;color:#000;outline:none\" style-focus=\"border-color:#008189;box-shadow:0 0 0 3px rgba(0,129,137,.18)\"><\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px;min-width:0\"><span style=\"font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#444\">FCA number (optional)<\u002Fspan><input value=\"{{ broker.fca }}\" sc-camel-on-change=\"{{ on.bFca }}\" style=\"width:100%;height:44px;padding:0 12px;border:1px solid #b9c2c8;border-radius:10px;font-size:15px;background:#fff;color:#000;outline:none\" style-focus=\"border-color:#008189;box-shadow:0 0 0 3px rgba(0,129,137,.18)\"><\u002Flabel>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 2 BORROWER -->\n      <section id=\"step2\" style=\"display:flex;flex-direction:column;gap:20px\">\n        <div style=\"display:flex;align-items:baseline;gap:14px;border-top:1px solid #000;padding-top:12px\">\n          <span style=\"font-size:13px;color:#008189;font-weight:600\">02<\u002Fspan>\n          <h2 style=\"margin:0;flex:none;white-space:nowrap;color:#193243;font-size:17px;font-weight:600;letter-spacing:.06em;text-transform:uppercase\">Borrower<\u002Fh2>\n        <\u002Fdiv>\n        <label style=\"display:flex;flex-direction:column;gap:6px;min-width:0\"><span style=\"font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#444\">Borrower name<\u002Fspan><input value=\"{{ borrower.name }}\" sc-camel-on-change=\"{{ on.brName }}\" style=\"width:100%;height:44px;padding:0 12px;border:1px solid #b9c2c8;border-radius:10px;font-size:15px;background:#fff;color:#000;outline:none\" style-focus=\"border-color:#008189;box-shadow:0 0 0 3px rgba(0,129,137,.18)\"><\u002Flabel>\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <span style=\"font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#444\">Borrower type<\u002Fspan>\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n            <sc-for list=\"{{ segs.btype }}\" as=\"o\" hint-placeholder-count=\"4\"><button sc-camel-on-click=\"{{ o.pick }}\" style=\"border-radius:999px;white-space:nowrap;flex:none;min-height:44px;padding:0 18px;border:1px solid #008189;border-radius:999px;font-size:14px;cursor:pointer;background:{{ o.bg }};color:{{ o.fg }}\">{{ o.label }}<\u002Fbutton><\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <span style=\"font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#444\">Loan purpose<\u002Fspan>\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n            <sc-for list=\"{{ segs.purpose }}\" as=\"o\" hint-placeholder-count=\"4\"><button sc-camel-on-click=\"{{ o.pick }}\" style=\"border-radius:999px;white-space:nowrap;flex:none;min-height:44px;padding:0 18px;border:1px solid #008189;border-radius:999px;font-size:14px;cursor:pointer;background:{{ o.bg }};color:{{ o.fg }}\">{{ o.label }}<\u002Fbutton><\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ isPurchase }}\" hint-placeholder-val=\"{{ false }}\">\n            <label style=\"display:flex;gap:12px;align-items:center;cursor:pointer;margin-top:6px\">\n              <input type=\"checkbox\" checked=\"{{ borrower.auction }}\" sc-camel-on-change=\"{{ on.auction }}\" style=\"width:20px;height:20px;margin:0;flex:none\">\n              <span>Purchase at auction<\u002Fspan>\n            <\u002Flabel>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <span style=\"font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#444\">Exit strategy<\u002Fspan>\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n            <sc-for list=\"{{ segs.exit }}\" as=\"o\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ o.pick }}\" style=\"border-radius:999px;white-space:nowrap;flex:none;min-height:44px;padding:0 18px;border:1px solid #008189;border-radius:999px;font-size:14px;cursor:pointer;background:{{ o.bg }};color:{{ o.fg }}\">{{ o.label }}<\u002Fbutton><\u002Fsc-for>\n          <\u002Fdiv>\n          <textarea value=\"{{ borrower.exitDetail }}\" sc-camel-on-change=\"{{ on.exitDetail }}\" rows=\"3\" placeholder=\"Exit detail (required): how and when the loan will be repaid\" style=\"width:100%;margin-top:6px;padding:10px 12px;border:1px solid #b9c2c8;border-radius:10px;font-size:15px;line-height:1.45;background:#fff;color:#000;outline:none;resize:vertical\" style-focus=\"border-color:#008189;box-shadow:0 0 0 3px rgba(0,129,137,.18)\"><\u002Ftextarea>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px;border-top:1px solid #c8c8c8;padding-top:16px\">\n          <label style=\"display:flex;gap:12px;align-items:flex-start;cursor:pointer\">\n            <input type=\"checkbox\" checked=\"{{ borrower.occupancy }}\" sc-camel-on-change=\"{{ on.occupancy }}\" style=\"width:20px;height:20px;margin:1px 0 0;flex:none\">\n            <span style=\"display:flex;flex-direction:column;gap:4px\"><span>No borrower or person related to the borrower occupies, has occupied, or will occupy any security property.<\u002Fspan><span style=\"font-size:13px;color:#444\">Required. CredX only does unregulated lending; submission is blocked until this is confirmed.<\u002Fspan><\u002Fspan>\n          <\u002Flabel>\n          <label style=\"display:flex;gap:12px;align-items:flex-start;cursor:pointer\">\n            <input type=\"checkbox\" checked=\"{{ borrower.works }}\" sc-camel-on-change=\"{{ on.works }}\" style=\"width:20px;height:20px;margin:1px 0 0;flex:none\">\n            <span>Loan request includes refurbishment or build costs<\u002Fspan>\n          <\u002Flabel>\n          <sc-if value=\"{{ borrower.works }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"border:2px solid #C62828;color:#C62828;border-radius:14px;padding:12px 18px;display:flex;gap:14px;align-items:baseline\">\n              <span style=\"font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase\">Flag<\u002Fspan>\n              <span style=\"font-weight:600\">CredX does not fund works. Acquisition only.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 3 SECURITIES -->\n      <section id=\"step3\" style=\"display:flex;flex-direction:column;gap:20px\">\n        <div style=\"display:flex;align-items:baseline;gap:14px;border-top:1px solid #000;padding-top:12px\">\n          <span style=\"font-size:13px;color:#008189;font-weight:600\">03<\u002Fspan>\n          <h2 style=\"margin:0;flex:none;white-space:nowrap;color:#193243;font-size:17px;font-weight:600;letter-spacing:.06em;text-transform:uppercase\">Securities<\u002Fh2>\n        <\u002Fdiv>\n        <sc-for list=\"{{ secs }}\" as=\"s\" hint-placeholder-count=\"1\">\n          <div style=\"display:flex;flex-direction:column;gap:16px;border:1px solid #dfe3e6;border-radius:20px;box-shadow:0 8px 28px rgba(25,50,67,.07);padding:20px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px\">\n              <span style=\"font-weight:600\">Security {{ s.num }}<\u002Fspan>\n              <sc-if value=\"{{ s.canRemove }}\" hint-placeholder-val=\"{{ false }}\">\n                <button sc-camel-on-click=\"{{ s.remove }}\" style=\"border-radius:999px;white-space:nowrap;flex:none;height:44px;padding:0 12px;border:1.5px solid #008189;background:#fff;color:#008189;font-weight:600;font-size:13px;cursor:pointer\" style-hover=\"text-decoration:underline\">Remove<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:16px 20px\">\n              <label style=\"display:flex;flex-direction:column;gap:6px;min-width:0;grid-column:1/-1\"><span style=\"font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#444\">Address<\u002Fspan><input value=\"{{ s.address }}\" sc-camel-on-change=\"{{ s.onAddress }}\" style=\"width:100%;height:44px;padding:0 12px;border:1px solid #b9c2c8;border-radius:10px;font-size:15px;background:#fff;color:#000;outline:none\" style-focus=\"border-color:#008189;box-shadow:0 0 0 3px rgba(0,129,137,.18)\"><\u002Flabel>\n              <label style=\"display:flex;flex-direction:column;gap :flex;align-items:center;border:1px solid #b9c2c8;border-radius:10px;overflow:hidden;height:44px\"><span style=\"padding:0 0 0 12px\">£<\u002Fspan><input sc-camel-input-mode=\"decimal\" sc-camel-enter-key-hint=\"next\" value=\"{{ s.firstBalance }}\" sc-camel-on-change=\"{{ s.onFirstBalance }}\" sc-camel-on-blur=\"{{ s.onFirstBalanceBlur }}\" placeholder=\"0.00\" style=\"flex:1;min-width:0;height:42px;padding:0 12px 0 6px;border:none;font-size:15px;background:#fff;color:#000;outline:none\"><\u002Fspan><\u002Flabel>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"display:flex;justify-content:space-between;gap:12px;border-top:1px solid #c8c8c8;padding-top:12px;font-size:14px\">\n              <span style=\"color:#444\">{{ s.ltvBasis }}<\u002Fspan>\n              <span style=\"font-weight:600\">{{ s.ltvValueFmt }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div>\n          <button sc-camel-on-click=\"{{ onAddSecurity }}\" style=\"border-radius:999px;white-space:nowrap;flex:none;height:44px;padding:0 18px;border:1.5px solid #008189;background:#fff;color:#008189;font-weight:600;font-size:15px;cursor:pointer\" style-hover=\"text-decoration:underline\">+ Add security<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 4 STRUCTURE -->\n      <section id=\"step4\" style=\"display:flex;flex-direction:column;gap:20px\">\n        <div style=\"display:flex;align-items:baseline;gap:14px;border-top:1px solid #000;padding-top:12px\">\n          <span style=\"font-size:13px;color:#008189;font-weight:600\">04<\u002Fspan>\n          <h2 style=\"margin:0;flex:none;white-space:nowrap;color:#193243;font-size:17px;font-weight:600;letter-spacing:.06em;text-transform:uppercase\">Structure the deal<\u002Fh2>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end\">\n          <label style=\"display:flex;flex-direction:column;gap:6px;flex:1 1 240px -weight:600;letter-spacing:.06em;text-transform:uppercase\">Indicative Quote<\u002Fh2>\n        <span style=\"margin-left:auto;font-size:12px;color:#444\">Updates as you type<\u002Fspan>\n      <\u002Fdiv>\n      <article data-quote=\"1\" style=\"border:1px solid #dfe3e6;border-radius:20px;box-shadow:0 8px 28px rgba(25,50,67,.07);padding:clamp(18px,3vw,32px);display:flex;flex-direction:column;gap:24px;background:#fff\">\n        <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap\">\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <img src=\"084dd9fc-227d-4947-9cb2-6f1ec0208fed\" alt=\"CredX\" style=\"height:22px;width:auto;display:block;align-self:flex-start\">\n            <h3 style=\"margin:10px 0 0;font-size:24px;font-weight:600;color:#193243;letter-spacing:-.01em\">Indicative Quote<\u002Fh3>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:auto auto;gap:2px 14px;font-size:13px\">\n            <span style=\"color:#444\">Reference<\u002Fspan><span style=\"font-weight:600;text-align:right;white-space:nowrap\">{{ q.ref }}<\u002Fspan>\n            <span style=\"color:#444\">Date<\u002Fspan><span style=\"text-align:right;white-space:nowrap\">{{ q.date }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px 20px;border-top:1px solid #000;padding-top:14px;font-size:14px\">\n          <div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#444\">Borrower<\u002Fspan><span style=\"font-weight:600\">{{ q.borrower }}<\u002Fspan><span style=\"color:#444\">{{ q.borrowerType }}<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#444\">Purpose<\u002Fspan><span>{{ q.purpose }}<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#444\">Exit<\u002Fspan><span>{{ q.exit }}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column\">\n          <div style=\"display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #000;padding-bottom:6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#444\"><span>Securities<\u002Fspan><span style=\"white-space:nowrap\">Value for LTV<\u002Fspan><\u002Fdiv>\n          <sc-for list=\"{{ q.secRows }}\" as=\"r\" hint-placeholder-count=\"1\">\n            <div style=\"display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid #c8c8c8;font-size:14px\">\n              <div style=\"display:flex;flex-direction:column;gap:2px;min-width:0\">\n                <span style=\"font-weight:600;overflow-wrap:anywhere\">{{ r.address }}<\u002Fspan>\n                <span style=\"color:#444\">{{ r.detail }}<\u002Fspan>\n                <sc-if value=\"{{ r.hasPrior }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"color:#444\">{{ r.prior }}<\u002Fspan><\u002Fsc-if>\n              <\u002Fdiv>\n              <span style=\"white-space:nowrap\">{{ r.value }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:14px\"><span>Total security value<\u002Fspan><span style=\"font-weight:600\">{{ q.totalValue }}<\u002Fspan><\u002Fdiv>\n          <sc-if value=\"{{ q.hasPrior }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;justify-content:space-between;gap:12px;padding:0 0 8px;font-size:14px\"><span>Total prior charges<\u002Fspan><span>{{ q.prior }}<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;font-size:14px\">\n          <div style=\"display:flex;justify-content:space-between;gap:12px;border-top:1px solid #000;border-bottom:1px solid #000;padding:10px 0;font-size:16px;font-weight:600\"><span>Gross loan<\u002Fspan><span>{{ q.gross }}<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #e0e0e0\"><span>Less arrangement fee ({{ q.arrPct }})<\u002Fspan><span>{{ q.arr }}<\u002Fspan><\u002Fdiv>\n          <sc-if value=\"{{ q.hasBroker }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #e0e0e0\"><span>Less broker fee ({{ q.brkPct }})<\u002Fspan><span>{{ q.brk }}<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n          <div style=\"display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #e0e0e0\"><span>Less retained interest ({{ q.intBasis }})<\u002Fspan><span>{{ q.int }}<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #000\"><span>Less loan setup fee<\u002Fspan><span>{{ q.setup }}<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:3px double #000;font-size:16px;font-weight:600\"><span>Net advance<\u002Fspan><span>{{ q.net }}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0;font-size:14px\">\n          <span style=\"padding:6px 12px 6px 0;border-bottom:1px solid #e0e0e0;color:#444\">Interest rate<\u002Fspan><span style=\"padding:6px 0;border-bottom:1px solid #e0e0e0;text-align:right\">{{ q.rate }}<\u002Fspan>\n          <span style=\"padding:6px 12px 6px 0;border-bottom:1px solid #e0e0e0;color:#444\">Term<\u002Fspan><span style=\"padding:6px 0;border-bottom:1px solid #e0e0e0;text-align:right\">{{ q.term }}<\u002Fspan>\n          <span style=\"padding:6px 12px 6px 0;border-bottom:1px solid #e0e0e0;color:#444\">Minimum interest period<\u002Fspan><span style=\"padding:6px 0;border-bottom:1px solid #e0e0e0;text-align:right\">{{ q.minInt }}<\u002Fspan>\n          <span style=\"padding:6px 12px 6px 0;border-bottom:1px solid #e0e0e0;color:#444\">LTV (gross facility plus prior charges)<\u002Fspan><span style=\"padding:6px 0;border-bottom:1px solid #e0e0e0;text-align:right;font-weight:600;color:{{ q.ltvColor }}\">{{ q.ltv }}<\u002Fspan>\n          <span style=\"padding:6px 12px 6px 0;border-bottom:1px solid #e0e0e0;color:#444\">Application fee (paid upfront, non-refundable, not deducted)<\u002Fspan><span style=\"padding:6px 0;border-bottom:1px solid #e0e0e0;text-align:right\">{{ q.appFee }}<\u002Fspan>\n          <span style=\"padding:6px 12px 6px 0;border-bottom:1px solid #e0e0e0;color:#444\">Redemption fee<\u002Fspan><span style=\"padding:6px 0;border-bottom:1px solid #e0e0e0;text-align:right\">{{ q.redemption }}<\u002Fspan>\n          <span style=\"padding:6px 12px 6px 0;border-bottom:1px solid #e0e0e0;color:#444\">Valuation fee<\u002Fspan><span style=\"padding:6px 0;border-bottom:1px solid #e0e0e0;text-align:right\">{{ q.valuation }}<\u002Fspan>\n          <span style=\"padding:6px 12px 6px 0;border-bottom:1px solid #e0e0e0;color:#444\">Lender legal fees<\u002Fspan><span style=\"padding:6px 0;border-bottom:1px solid #e0e0e0;text-align:right\">{{ q.legal }}<\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column\">\n          <div style=\"border-bottom:1px solid #000;padding-bottom:6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#444\">Criteria checks<\u002Fdiv>\n          <sc-for list=\"{{ criteria }}\" as=\"c\" hint-placeholder-count=\"5\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #e0e0e0;font-size:14px\">\n              <span style=\"display:flex;flex-direction:column;min-width:0\"><span>{{ c.label }}<\u002Fspan><span style=\"font-size:12px;color:{{ c.detailColor }}\">{{ c.detail }}<\u002Fspan><\u002Fspan>\n              <sc-if value=\"{{ c.pass }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"min-width:52px;text-align:center;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border:1px solid #c8c8c8\">Pass<\u002Fspan><\u002Fsc-if>\n              <sc-if value=\"{{ c.amber }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"min-width:52px;text-align:center;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border:2px solid #B45309;color:#B45309\">Refer<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ c.flag }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"min-width:52px;text-align:center;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border:2px solid #C62828;color:#C62828\">Flag<\u002Fspan><\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <div style=\"display:flex;flex-direction:column;gap:4px;border-bottom:1px solid #000;padding-bottom:6px\">\n            <span style=\"font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#444\">Documents<\u002Fspan>\n            <span style=\"font-size:13px;color:#444\">Suggested documents. CredX may request further information at its discretion.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <span style=\"font-size:13px;font-weight:600\">Stage 1: needed to review the deal<\u002Fspan>\n            <sc-for list=\"{{ docs1 }}\" as=\"d\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;gap:10px;align-items:flex-start;font-size:14px\">\n              <span style=\"flex:none;width:8px;border-top:1px solid #000;margin-top:.72em\"><\u002Fspan>\n              <span style=\"display:flex;flex-direction:column;min-width:0\"><span style=\"text-wrap:pretty\">{{ d.text }}<\u002Fspan><span style=\"font-size:12px;color:#444\">{{ d.why }}<\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px;border-top:1px solid #e0e0e0;padding-top:12px\">\n            <span style=\"font-size:13px;font-weight:600\">Stage 2: needed before completion<\u002Fspan>\n            <sc-for list=\"{{ docs2 }}\" as=\"d\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;gap:10px;align-items:flex-start;font-size:14px\">\n              <span style=\"flex:none;width:8px;border-top:1px solid #000;margin-top:.72em\"><\u002Fspan>\n              <span style=\"display:flex;flex-direction:column;min-width:0\"><span style=\"text-wrap:pretty\">{{ d.text }}<\u002Fspan><span style=\"font-size:12px;color:#444\">{{ d.why }}<\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <p style=\"margin:0;border-top:1px solid #000;padding-top:12px;font-size:11.5px;line-height:1.5;color:#333;text-wrap:pretty\">Indicative only. This is not an offer of finance or a Decision in Principle. All lending is subject to underwriting, valuation, legal due diligence and CredX credit approval. CredX provides unregulated bridging finance only. CredX Ltd, Company No. 16640225. Registered Office: Suite F16 St George's Business Park, Castle Road, Sittingbourne, Kent ME10 3TB.<\u002Fp>\n      <\u002Farticle>\n      <div data-noprint=\"1\" style=\"display:flex;flex-wrap:wrap;gap:10px\">\n        <button sc-camel-on-click=\"{{ onPrint }}\" style=\"border-radius:999px;white-space:nowrap;flex:none;height:44px;padding:0 18px;border:1px solid #008189;background:#008189;color:#fff;font-weight:600;font-size:15px;cursor:pointer\" style-hover=\"text-decoration:underline\">Download Indicative Quote (PDF)<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ onCopySummary }}\" style=\"border-radius:999px;white-space:nowrap;flex:none;height:44px;padding:0 18px;border:1.5px solid #008189;background:#fff;color:#008189;font-weight:600;font-size:15px;cursor:pointer\" style-hover=\"text-decoration:underline\">{{ copyLabels.summary }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n\n  <!-- 6 PROPOSE -->\n  <section id=\"step6\" data-noprint=\"1\" style=\"display:flex;flex-direction:column;gap:20px;max-width:860px\">\n    <div style=\"display:flex;align-items:baseline;gap:14px;border-top:1px solid #000;padding-top:12px\">\n      <span style=\"font-size:13px;color:#008189;font-weight:600\">06<\u002Fspan>\n      <h2 style=\"margin:0;flex:none;white-space:nowrap;color:#193243;font-size:17px;font-weight:600;letter-spacing:.06em;text-transform:uppercase\">Propose deal to CredX<\u002Fh2>\n    <\u002Fdiv>\n    <label style=\"display:flex;flex-direction:column;gap:6px\">\n      <span style=\"font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#444\">{{ commentaryLabel }}<\u002Fspan>\n      <textarea value=\"{{ commentary }}\" sc-camel-on-change=\"{{ onCommentary }}\" rows=\"6\" placeholder=\"Background to the deal, borrower profile, and your case for any flagged criteria.\" style=\"width:100%;padding:10px 12px;border:1px solid #b9c2c8;border-radius:10px;font-size:15px;line-height:1.45;background:#fff;color:#000;outline:none;resize:vertical\" style-focus=\"border-color:#008189;box-shadow:0 0 0 3px rgba(0,129,137,.18)\"><\u002Ftextarea>\n    <\u002Flabel>\n    <sc-if value=\"{{ hasBlockers }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:6px;border:1.5px solid #193243;border-radius:14px;padding:14px 18px\">\n        <span style=\"font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase\">Before you can submit<\u002Fspan>\n        <sc-for list=\"{{ blockers }}\" as=\"b\" hint-placeholder-count=\"2\">\n          <div style=\"display:flex;gap:10px;align-items:flex-start;font-size:14px\"><span style=\"flex:none;width:8px;border-top:1px solid #000;margin-top:.72em\"><\u002Fspan><span>{{ b.text }}<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n      <button sc-camel-on-click=\"{{ onSubmit }}\" disabled=\"{{ submitDisabled }}\" style=\"border-radius:999px;white-space:nowrap;flex:none;height:48px;padding:0 24px;border:1px solid #008189;background:#008189;color:#fff;font-weight:600;font-size:16px;font-weight:600;cursor:pointer;opacity:{{ submitOpacity }}\" style-hover=\"text-decoration:underline\">Submit to CredX<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ onCopySubmission }}\" style=\"border-radius:999px;white-space:nowrap;flex:none;height:48px;padding:0 18px;border:1.5px solid #008189;background:#fff;color:#008189;font-weight:600;font-size:15px;cursor:pointer\" style-hover=\"text-decoration:underline\">{{ copyLabels.submission }}<\u002Fbutton>\n    <\u002Fdiv>\n    <sc-if value=\"{{ submitted }}\" hint-placeholder-val=\"{{ false }}\">\n      <p style=\"margin:0;border-top:1px solid #000;border-bottom:1px solid #000;padding:12px 0;font-weight:600\">Your email is ready to send. CredX will review the deal and, if suitable, issue a formal DIP.<\u002Fp>\n    <\u002Fsc-if>\n    <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;font-size:14px\">\n      <span style=\"color:#444\">Submissions go to<\u002Fspan>\n      <span style=\"user-select:all;font-weight:600;font-size:15px\">dg@credx.co.uk<\u002Fspan>\n      <button sc-camel-on-click=\"{{ onCopyEmail }}\" style=\"border-radius:999px;white-space:nowrap;flex:none;height:44px;padding:0 12px;border:1.5px solid #008189;background:#fff;color:#008189;font-weight:600;font-size:13px;cursor:pointer\" style-hover=\"text-decoration:underline\">{{ copyLabels.email }}<\u002Fbutton>\n      <span style=\"color:#444;flex-basis:100%\">If your email client does not open, copy the submission and paste it into an email to this address.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 7 FORMS -->\n  <section id=\"step7\" data-noprint=\"1\" style=\"display:flex;flex-direction:column;gap:20px;max-width:860px\">\n    <div style=\"display:flex;align-items:baseline;gap:14px;border-top:1px solid #000;padding-top:12px\">\n      <span style=\"font-size:13px;color:#008189;font-weight:600\">07<\u002Fspan>\n      <h2 style=\"margin:0;flex:none;white-space:nowrap;color:#193243;font-size:17px;font-weight:600;letter-spacing:.06em;text-transform:uppercase\">Client forms<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px\">\n      <div style=\"border:1px solid #dfe3e6;border-radius:20px;box-shadow:0 8px 28px rgba(25,50,67,.07);padding:24px;display:flex;flex-direction:column;gap:16px;justify-content:space-between\">\n        <div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:17px;font-weight:600\">CredX Application Form<\u002Fspan><span style=\"font-size:13px;color:#444\">PDF<\u002Fspan><\u002Fdiv>\n        <a href=\"{{ forms.application }}\" download=\"\" style=\"align-self:flex-start;display:inline-flex;align-items:center;height:40px;padding:0 16px;border:1px solid #008189;background:#008189;color:#fff;border-radius:999px;font-weight:600;text-decoration:none;font-size:14px\" style-hover=\"text-decoration:underline\">Download<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #dfe3e6;border-radius:20px;box-shadow:0 8px 28px rgba(25,50,67,.07);padding:24px;display:flex;flex-direction:column;gap:16px;justify-content:space-between\">\n        <div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:17px;font-weight:600\">Statement of Assets and Liabilities<\u002Fspan><span style=\"font-size:13px;color:#444\">Word document (DOCX)<\u002Fspan><\u002Fdiv>\n        <a href=\"{{ forms.sal }}\" download=\"\" style=\"align-self:flex-start;display:inline-flex;align-items:center;height:40px;padding:0 16px;border:1px solid #008189;background:#008189;color:#fff;border-radius:999px;font-weight:600;text-decoration:none;font-size:14px\" style-hover=\"text-decoration:underline\">Download<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:14px;color:#444\">Download, have your client complete, and return to dg@credx.co.uk with the deal reference.<\u002Fp>\n  <\u002Fsection>\n<\u002Fmain>\n\n<footer data-noprint=\"1\" style=\"background:#1a1a1a;color:#fff\">\n  <div style=\"max-width:1280px;margin:0 auto;padding:20px max(clamp(16px,4vw,40px),env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(clamp(16px,4vw,40px),env(safe-area-inset-left));display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;font-size:13px\">\n    <span>CredX Ltd, Suite 013 Regus, Victory Way, Crossways, Dartford, Kent DA2 6QD.<\u002Fspan>\n    <a href=\"mailto:dg@credx.co.uk\" style=\"color:#fff\">dg@credx.co.uk<\u002Fa>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  // ===== CredX pricing and settings: edit here =====\n  static CONFIG = {\n    ratePA: 0.14,              // minimum pricing: simple interest per annum on gross, retained for full term\n    arrangementPct: 0.02,      // of gross, deducted\n    brokerPct: 0.01,           // of gross, deducted when broker fee is on\n    setupFee: 1495,            // deducted\n    applicationFee: 495,       // paid upfront by borrower, non-refundable, not deducted\n    maxLTV: 0.70,              // standard max, on gross facility plus prior charges (Maximise loan uses this)\n    hardLTV: 0.75,             // above maxLTV up to this shows orange; above this shows red and blocks submission\n    amberColor: '#B45309',\n    redColor: '#C62828',\n    minGross: 30000,\n    maxGross: 750000,\n    terms: [{ months: 6, minInterest: 3 }, { months: 12, minInterest: 6 }],\n    defaultTerm: 12,\n    redemptionFee: 'Confirmed in DIP',\n    valuationFee: 'TBC, paid by borrower',\n    legalFees: 'TBC, paid by borrower',\n    submitEmail: 'dg@credx.co.uk',\n    forms: { application: 'assets/forms/CredX_Application_Form.pdf', sal: 'assets/forms/CredX_Statement_of_Assets_and_Liabilities.docx' },\n  };\n\n  blankSec(id) { return { id, address: '', postcode: '', type: 'Residential', tenure: 'Freehold', tenanted: 'No', mv: '', pp: '', charge: '1st', firstLender: '', firstBalance: '' }; }\n  blankDeal() {\n    return {\n      borrower: { name: '', type: '', purpose: '', exitType: '', exitDetail: '', occupancy: false, works: false, auction: false },\n      secs: [this.blankSec(1)], nextId: 2, net: '', term: Component.CONFIG.defaultTerm, brokerOn: true,\n      commentary: '', ref: this.makeRef(), submitted: false, isExample: false,\n    };\n  }\n  exampleDeal() {\n    return {\n      ...this.blankDeal(),\n      borrower: { name: 'Example Holdings Ltd', type: 'UK Limited Company', purpose: 'Refinance', exitType: 'Refinance', exitDetail: 'Refinance onto a buy-to-let term loan within 12 months.', occupancy: true, works: false, auction: false },\n      secs: [{ ...this.blankSec(1), address: '1 Example Street, London', postcode: 'SW1A 1AA', mv: '400,000.00' }],\n      net: '200,000.00', term: 12, brokerOn: true, isExample: true,\n    };\n  }\n  makeRef() {\n    const d = new Date(), p = n => String(n).padStart(2, '0');\n    const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';\n    let x = ''; for (let i = 0; i < 4; i++) x += abc[Math.floor(Math.random() * abc.length)];\n    return `CDX-IQ-${String(d.getFullYear()).slice(2)}${p(d.getMonth() + 1)}${p(d.getDate())}-${x}`;\n  }\n\n  state = { showGuide: true, broker: { name: '', firm: '', email: '', phone: '', fca: '' }, copied: '', ...this.exampleDeal() };\n\n  num(s) { const n = parseFloat(String(s ?? '').replace(/[^0-9.]/g, '')); return isFinite(n) ? n : 0; }\n  r2(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }\n  gbp(n) { return '£' + (n || 0).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }\n  plain(n) { return n.toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }\n  pct(n) { return (n * 100).toFixed(2) + '%'; }\n  upd(fn) { this.setState(s => ({ ...fn(s), isExample: false, submitted: false })); }\n\n  calc() {\n    const C = Component.CONFIG, s = this.state;\n    const termObj = C.terms.find(t => t.months === s.term) || C.terms[0];\n    const bp = s.brokerOn ? C.brokerPct : 0;\n    const df = 1 - C.arrangementPct - bp - C.ratePA * termObj.months / 12;\n    const netIn = this.num(s.net), hasNet = netIn > 0;\n    const gross = hasNet ? this.r2((netIn + C.setupFee) / df) : 0;\n    const arr = this.r2(gross * C.arrangementPct), brk = this.r2(gross * bp);\n    const int = this.r2(gross * C.ratePA * termObj.months / 12);\n    const setup = hasNet ? C.setupFee : 0;\n    const net = this.r2(gross - arr - brk - int - setup);\n    const isPurchase = s.borrower.purpose === 'Purchase';\n    const secs = s.secs.map(x => {\n      const mv = this.num(x.mv), pp = isPurchase ? this.num(x.pp) : 0;\n      const ltvValue = pp > 0 ? Math.min(pp, mv) : mv;\n      const prior = x.charge === '2nd' ? this.num(x.firstBalance) : 0;\n      return { ...x, mvN: mv, ppN: pp, ltvValue, prior, basis: pp > 0 ? (pp <= mv ? 'purchase price' : 'market value') : 'market value' };\n    });\n    const totalValue = secs.reduce((a, x) => a + x.ltvValue, 0);\n    const prior = secs.reduce((a, x) => a + x.prior, 0);\n    const ltv = totalValue > 0 && hasNet ? (gross + prior) / totalValue : null;\n    const maxGrossLTV = C.maxLTV * totalValue - prior;\n    const maxGross = Math.min(maxGrossLTV, C.maxGross);\n    const maxNet = totalValue > 0 ? Math.floor(maxGross * df - C.setupFee) : 0;\n    return { C, termObj, bp, df, hasNet, gross, arr, brk, int, setup, net, secs, totalValue, prior, ltv, maxNet, isPurchase, maxGrossLTV };\n  }\n\n  criteria(k) {\n    const { C } = k, b = this.state.borrower;\n    const ltvOk = k.ltv !== null && k.ltv <= C.maxLTV + 1e-9;\n    const ltvAmber = k.ltv !== null && !ltvOk && k.ltv <= C.hardLTV + 1e-9;\n    const ltvDetail = k.ltv === null ? 'Not calculated' : ltvOk ? this.pct(k.ltv)\n      : ltvAmber ? `${this.pct(k.ltv)}. Above ${Math.round(C.maxLTV * 100)}% standard, within ${Math.round(C.hardLTV * 100)}% limit`\n      : `${this.pct(k.ltv)}. Above ${Math.round(C.hardLTV * 100)}% maximum`;\n    const grossOk = k.hasNet && k.gross >= C.minGross && k.gross <= C.maxGross;\n    const exitOk = !!b.exitType && b.exitDetail.trim().length > 0;\n    return [\n      { label: `LTV at or below ${Math.round(C.maxLTV * 100)}%`, detail: ltvDetail, ok: ltvOk, level: ltvOk ? 'pass' : ltvAmber ? 'amber' : 'flag' },\n      { label: `Gross loan between ${this.gbp(C.minGross)} and ${this.gbp(C.maxGross)}`, detail: k.hasNet ? this.gbp(k.gross) : 'Not calculated', ok: grossOk },\n      { label: 'Occupancy declaration given', detail: b.occupancy ? 'Given' : 'Not given', ok: b.occupancy },\n      { label: 'No works funding requested', detail: b.works ? 'Works requested. CredX does not fund works.' : 'Acquisition only', ok: !b.works },\n      { label: 'Exit strategy provided', detail: exitOk ? b.exitType : 'Exit type and detail required', ok: exitOk },\n    ];\n  }\n\n  docs(k) {\n    const b = this.state.borrower, secs = k.secs, has = f => secs.some(f);\n    const s1 = [], s2 = [], add = (arr, why, items) => items.forEach(t => arr.push({ text: t, why }));\n    add(s1, 'All deals', ['Completed Application Form', 'Statement of Assets and Liabilities', 'Exit strategy detail']);\n    if (b.purpose === 'Purchase') add(s1, 'Purpose: Purchase', ['Memorandum of sale or accepted offer', 'Proof of deposit and its source']);\n    if (b.purpose === 'Purchase' && b.auction) add(s1, 'Purchase at auction', ['Auction legal pack', 'Completion deadline']);\n    if (b.purpose === 'Refinance') add(s1, 'Purpose: Refinance', ['Redemption statement from the existing lender']);\n    if (has(x => x.charge === '2nd')) add(s1, '2nd charge security', ['Latest first charge mortgage statement']);\n    if (b.exitType === 'Refinance') add(s1, 'Exit: Refinance', ['Exit lender AIP or broker outline of the refinance']);\n    if (b.exitType === 'Sale') add(s1, 'Exit: Sale', ['Agent marketing appraisal or comparable sales']);\n    add(s2, 'All individuals, directors and 25%+ shareholders', ['Certified photo ID', 'Two certified proofs of address dated within 3 months']);\n    if (b.type === 'UK Limited Company' || b.type === 'SPV') add(s2, 'Borrower: ' + b.type, ['Certificate of incorporation', 'Shareholder structure chart', 'Latest accounts or management accounts', 'Personal guarantees from directors']);\n    if (has(x => x.type === 'Residential')) add(s2, 'Residential security', ['EPC rated E or above', 'Gas safety certificate']);\n    if (has(x => x.type === 'Commercial' || x.type === 'Mixed use')) add(s2, 'Commercial or mixed use security', ['Fire risk assessment', 'Asbestos report']);\n    if (has(x => x.tenure === 'Leasehold')) add(s2, 'Leasehold security', ['Copy of lease showing remaining term']);\n    if (has(x => x.tenanted === 'Yes')) add(s2, 'Tenanted security', ['Tenancy agreement or lease', 'Rent schedule']);\n    if (has(x => x.charge === '2nd')) add(s2, '2nd charge security', ['First charge lender consent (CredX solicitors will request)']);\n    add(s2, 'Valuation', ['Desktop in the first instance, full RICS inspection at CredX discretion, surveyor fee paid by borrower']);\n    return { s1, s2 };\n  }\n\n  quoteText(k, full) {\n    const s = this.state, b = s.borrower, C = k.C, L = [];\n    const dt = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });\n    L.push('CREDX INDICATIVE QUOTE', `Reference: ${s.ref}`, `Date: ${dt}`, '');\n    if (full) {\n      const r = s.broker;\n      L.push('BROKER', `Name: ${r.name}`, `Firm: ${r.firm}`, `Email: ${r.email}`, `Phone: ${r.phone}`, `FCA number: ${r.fca || 'Not provided'}`, '');\n    }\n    L.push('BORROWER', `Name: ${b.name || 'Not entered'}`, `Type: ${b.type || 'Not selected'}`, `Loan purpose: ${b.purpose || 'Not selected'}`,\n      `Exit strategy: ${b.exitType || 'Not selected'}${b.exitDetail.trim() ? '. ' + b.exitDetail.trim() : ''}`,\n      `Occupancy declaration: ${b.occupancy ? 'Given' : 'NOT GIVEN'}`, `Refurbishment or build costs requested: ${b.works ? 'Yes' : 'No'}`, '');\n    L.push('SECURITIES');\n    k.secs.forEach((x, i) => {\n      L.push(`${i + 1}. ${x.address || 'Address not entered'}${x.postcode ? ', ' + x.postcode.toUpperCase() : ''}`);\n      L.push(`   ${x.type}, ${x.tenure}, ${x.charge} charge`);\n      L.push(`   Market value ${this.gbp(x.mvN)}${k.isPurchase && x.ppN > 0 ? '; Purchase price ' + this.gbp(x.ppN) : ''}; Value for LTV ${this.gbp(x.ltvValue)}`);\n      if (x.charge === '2nd') L.push(`   Existing first charge: ${x.firstLender || 'Lender not entered'}, balance ${this.gbp(x.prior)}`);\n    });\n    L.push(`Total security value: ${this.gbp(k.totalValue)}`);\n    if (k.prior > 0) L.push(`Total prior charges: ${this.gbp(k.prior)}`);\n    L.push('', 'FIGURES', `Gross loan: ${this.gbp(k.gross)}`, `Arrangement fee (${this.pct(C.arrangementPct)}): ${this.gbp(k.arr)}`);\n    if (s.brokerOn) L.push(`Broker fee (${this.pct(C.brokerPct)}): ${this.gbp(k.brk)}`);\n    L.push(`Retained interest (${this.pct(C.ratePA)} p.a., ${k.termObj.months} months): ${this.gbp(k.int)}`, `Loan setup fee: ${this.gbp(k.setup)}`,\n      `Net advance: ${this.gbp(k.net)}`, `Interest rate: ${this.pct(C.ratePA)} per annum, simple, retained`, `Term: ${k.termObj.months} months`,\n      `Minimum interest period: ${k.termObj.minInterest} months`, `LTV: ${k.ltv === null ? 'Not calculated' : this.pct(k.ltv)}`,\n      `Application fee: ${this.gbp(C.applicationFee)} (paid upfront, non-refundable, not deducted)`, `Redemption fee: ${C.redemptionFee}`,\n      `Valuation fee: ${C.valuationFee}`, `Lender legal fees: ${C.legalFees}`, '', 'CRITERIA CHECKS');\n    this.criteria(k).forEach(c => L.push(`- ${c.label}: ${c.ok ? 'Pass' : c.level === 'amber' ? 'Refer, OUTSIDE STANDARD CRITERIA' : 'Flag, OUTSIDE STANDARD CRITERIA'} (${c.detail})`));\n    { const D = this.docs(k); L.push('', 'DOCUMENTS', 'Suggested documents. CredX may request further information at its discretion.', '', 'Stage 1: needed to review the deal');\n      D.s1.forEach(d => L.push(`[ ] ${d.text} (${d.why})`)); L.push('', 'Stage 2: needed before completion'); D.s2.forEach(d => L.push(`[ ] ${d.text} (${d.why})`)); }\n    if (full) L.push('', 'BROKER COMMENTARY', s.commentary.trim() || 'None provided');\n    L.push('', 'Indicative only. This is not an offer of finance or a Decision in Principle. All lending is subject to underwriting, valuation, legal due diligence and CredX credit approval. CredX provides unregulated bridging finance only. CredX Ltd, Company No. 16640225.');\n    return L.join('\\n');\n  }\n\n  copy(text, key) {\n    const done = () => { this.setState({ copied: key }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ copied: '' }), 1800); };\n    const fallback = () => { const t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (e) {} t.remove(); done(); };\n    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();\n  }\n\n  seg(options, current, pick) {\n    return options.map(o => { const v = typeof o === 'object' ? o.value : o, l = typeof o === 'object' ? o.label : o, on = v === current;\n      return { label: l, pick: () => pick(v), bg: on ? '#008189' : '#fff', fg: on ? '#fff' : '#193243' }; });\n  }\n\n  renderVals() {\n    const s = this.state, k = this.calc(), C = k.C;\n    const b = (key) => e => { const v = e.target.value; this.upd(st => ({ broker: { ...st.broker, [key]: v } })); };\n    const br = (key, isCheck) => e => { const v = isCheck ? e.target.checked : e.target.value; this.upd(st => ({ borrower: { ...st.borrower, [key]: v } })); };\n    const brPick = key => v => this.upd(st => ({ borrower: { ...st.borrower, [key]: v } }));\n    const setSec = (id, patch) => this.upd(st => ({ secs: st.secs.map(x => x.id === id ? { ...x, ...patch } : x) }));\n    const secIn = (id, key) => e => setSec(id, { [key]: e.target.value });\n    const secBlur = (id, key) => e => { const raw = e.target.value; if (String(raw).trim() === '') return; setSec(id, { [key]: this.plain(this.num(raw)) }); };\n\n    const secs = k.secs.map((x, i) => ({\n      ...x, num: i + 1, canRemove: s.secs.length > 1, showPP: k.isPurchase, isSecond: x.charge === '2nd',\n      remove: () => this.upd(st => ({ secs: st.secs.filter(y => y.id !== x.id) })),\n      onAddress: secIn(x.id, 'address'), onPostcode: secIn(x.id, 'postcode'),\n      onMv: secIn(x.id, 'mv'), onMvBlur: secBlur(x.id, 'mv'), onPp: secIn(x.id, 'pp'), onPpBlur: secBlur(x.id, 'pp'),\n      onFirstLender: secIn(x.id, 'firstLender'), onFirstBalance: secIn(x.id, 'firstBalance'), onFirstBalanceBlur: secBlur(x.id, 'firstBalance'),\n      typeOpts: this.seg(['Residential', 'Commercial', 'Mixed use', 'Land'], x.type, v => setSec(x.id, { type: v })),\n      tenantedOpts: this.seg(['Yes', 'No'], x.tenanted, v => setSec(x.id, { tenanted: v })),\n      tenureOpts: this.seg(['Freehold', 'Leasehold'], x.tenure, v => setSec(x.id, { tenure: v })),\n      chargeOpts: this.seg([{ value: '1st', label: '1st charge' }, { value: '2nd', label: '2nd charge' }], x.charge, v => setSec(x.id, { charge: v })),\n      ltvBasis: `Value used for LTV (lower of purchase price and market value)`.replace(/ \\(.*\\)/, k.isPurchase ? ' (lower of purchase price and market value)' : ' (market value)'),\n      ltvValueFmt: this.gbp(x.ltvValue),\n    }));\n\n    const crit = this.criteria(k);\n    const anyFlag = crit.some(c => !c.ok);\n    const r = s.broker, bw = s.borrower;\n    const blockers = [];\n    if (!bw.occupancy) blockers.push('Tick the occupancy declaration. CredX only does unregulated lending.');\n    if (!r.name.trim() || !r.firm.trim() || !r.email.trim() || !r.phone.trim()) blockers.push('Complete your broker details: name, firm, email and phone.');\n    if (!bw.name.trim()) blockers.push('Enter the borrower name.');\n    if (!bw.exitType || !bw.exitDetail.trim()) blockers.push('Select an exit strategy and give the exit detail.');\n    if (!k.secs.some(x => x.address.trim() && x.ltvValue > 0)) blockers.push('Enter at least one security with an address and value.');\n    if (!k.hasNet) blockers.push('Enter the net advance required.');\n    if (k.ltv !== null && k.ltv > C.hardLTV + 1e-9) blockers.push(`Reduce the loan. LTV is above the ${Math.round(C.hardLTV * 100)}% maximum.`);\n    if (anyFlag && !s.commentary.trim()) blockers.push('Add broker commentary. It is required when any criteria check shows Flag.');\n\n    const dash = '-';\n    const ltvColor = k.ltv === null || k.ltv <= C.maxLTV + 1e-9 ? '#000' : k.ltv <= C.hardLTV + 1e-9 ? C.amberColor : C.redColor;\n    const g = v => k.hasNet ? this.gbp(v) : dash;\n    const firstAddr = (k.secs[0] && k.secs[0].address.trim()) || 'Address not entered';\n\n    return {\n      broker: s.broker, borrower: s.borrower,\n      isExample: s.isExample, notExample: !s.isExample,\n      showGuide: s.showGuide, hideGuide: !s.showGuide, guideToggleLabel: s.showGuide ? 'Hide guide' : 'How to use',\n      onToggleGuide: () => this.setState(st => ({ showGuide: !st.showGuide })),\n      guide: [\n        ['Your details', 'Name, firm, email and phone. These go on the submission to CredX.'],\n        ['Borrower', 'Type, purpose and exit, with exit detail. Tick the occupancy declaration: CredX only does unregulated lending.'],\n        ['Securities', 'Add each property. LTV uses the lower of purchase price and market value. Add first charge details for any 2nd charge.'],\n        ['Structure the deal', 'Enter the net advance and term, or press Maximise loan for the most available at 70% LTV.'],\n        ['Check the quote', 'The Indicative Quote updates as you type. Criteria show Pass, Refer (orange) or Flag (red).'],\n        ['Submit to CredX', 'Add commentary (required if anything is outside criteria) and press Submit to open a pre-filled email.'],\n        ['Client forms', 'Download the Application Form and Statement of Assets and Liabilities for your client to complete.'],\n      ].map(([title, text], i) => ({ num: String(i + 1).padStart(2, '0'), title, text, href: '#step' + (i + 1) })),\n      onClear: () => this.setState({ ...this.blankDeal(), copied: '' }),\n      onLoadExample: () => this.setState({ ...this.exampleDeal(), copied: '' }),\n      on: {\n        bName: b('name'), bFirm: b('firm'), bEmail: b('email'), bPhone: b('phone'), bFca: b('fca'),\n        brName: br('name'), exitDetail: br('exitDetail'), occupancy: br('occupancy', true), works: br('works', true), auction: br('auction', true),\n      },\n      segs: {\n        btype: this.seg(['Individual', 'UK Limited Company', 'SPV', 'Other'], bw.type, brPick('type')),\n        purpose: this.seg(['Purchase', 'Refinance', 'Capital raise', 'Other'], bw.purpose, brPick('purpose')),\n        exit: this.seg(['Sale', 'Refinance', 'Other'], bw.exitType, brPick('exitType')),\n        term: this.seg(C.terms.map(t => ({ value: t.months, label: `${t.months} months` })), s.term, v => this.upd(() => ({ term: v }))),\n      },\n      secs,\n      onAddSecurity: () => this.upd(st => ({ secs: [...st.secs, this.blankSec(st.nextId)], nextId: st.nextId + 1 })),\n      netRaw: s.net,\n      onNet: e => { const v = e.target.value; this.upd(() => ({ net: v })); },\n      onNetBlur: e => { const raw = e.target.value; if (String(raw).trim() === '') return; this.setState({ net: this.plain(this.num(raw)) }); },\n      onMax: () => { if (k.maxNet > 0) this.upd(() => ({ net: this.plain(k.maxNet) })); },\n      termNote: `Minimum ${k.termObj.minInterest} months interest. Interest retained for the full term.`,\n      brokerOn: s.brokerOn,\n      onBrokerToggle: e => { const v = e.target.checked; this.upd(() => ({ brokerOn: v })); },\n      brokerFeeLabel: `Include broker fee (${this.pct(C.brokerPct)} of gross, deducted)`,\n      res: {\n        gross: g(k.gross), net: g(k.net), ltv: k.ltv === null ? dash : this.pct(k.ltv), ltvColor,\n        maxLabel: k.maxGrossLTV > C.maxGross ? `Max net (gross cap)` : `Max net at ${Math.round(C.maxLTV * 100)}% LTV`,\n        maxNet: k.maxNet > 0 ? this.gbp(k.maxNet) : dash,\n        hasMsg: k.totalValue > 0 && k.maxNet <= 0,\n        msg: 'Security value is not sufficient for a loan at the maximum LTV after prior charges.',\n      },\n      q: {\n        ref: s.ref, date: new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }),\n        borrower: bw.name || 'Not entered', borrowerType: bw.type || 'Type not selected', purpose: bw.purpose || 'Not selected',\n        exit: bw.exitType ? bw.exitType : 'Not selected',\n        secRows: k.secs.map(x => ({\n          address: (x.address || 'Address not entered') + (x.postcode ? ', ' + x.postcode.toUpperCase() : ''),\n          detail: `${x.type}, ${x.tenure}, ${x.charge} charge. Valued on ${x.basis}.`,\n          hasPrior: x.charge === '2nd', prior: `Prior charge: ${x.firstLender || 'lender not entered'}, ${this.gbp(x.prior)}`,\n          value: this.gbp(x.ltvValue),\n        })),\n        totalValue: this.gbp(k.totalValue), hasPrior: k.prior > 0, prior: this.gbp(k.prior),\n        gross: g(k.gross), arr: g(k.arr), brk: g(k.brk), int: g(k.int), setup: g(k.setup), net: g(k.net),\n        arrPct: `${this.pct(C.arrangementPct)} of gross`, brkPct: `${this.pct(C.brokerPct)} of gross`, hasBroker: s.brokerOn,\n        intBasis: `${this.pct(C.ratePA)} p.a. x ${k.termObj.months} months`,\n        rate: `${this.pct(C.ratePA)} p.a. minimum pricing, simple, retained`, term: `${k.termObj.months} months`, minInt: `${k.termObj.minInterest} months`,\n        ltv: k.ltv === null ? dash : `${this.pct(k.ltv)} (standard max ${Math.round(C.maxLTV * 100)}%)`, ltvColor,\n        appFee: this.gbp(C.applicationFee), redemption: C.redemptionFee, valuation: C.valuationFee, legal: C.legalFees,\n      },\n      criteria: crit.map(c => ({ label: c.label, detail: c.detail, pass: c.ok, amber: c.level === 'amber', flag: !c.ok && c.level !== 'amber', detailColor: c.level === 'amber' ? C.amberColor : c.level === 'flag' ? C.redColor : '#444' })),\n      docs1: this.docs(k).s1, docs2: this.docs(k).s2, isPurchase: k.isPurchase,\n      onPrint: () => { const t = document.title; document.title = `CredX Indicative Quote ${s.ref}`; window.print(); setTimeout(() => { document.title = t; }, 500); },\n      onCopySummary: () => this.copy(this.quoteText(k, false), 'summary'),\n      copyLabels: {\n        summary: s.copied === 'summary' ? 'Copied' : 'Copy summary',\n        submission: s.copied === 'submission' ? 'Copied' : 'Copy submission',\n        email: s.copied === 'email' ? 'Copied' : 'Copy address',\n      },\n      commentary: s.commentary,\n      onCommentary: e => { const v = e.target.value; this.setState({ commentary: v, submitted: false }); },\n      commentaryLabel: anyFlag ? 'Broker commentary (required: criteria flagged)' : 'Broker commentary',\n      blockers: blockers.map(t => ({ text: t })), hasBlockers: blockers.length > 0,\n      submitDisabled: blockers.length > 0, submitOpacity: blockers.length > 0 ? 0.35 : 1,\n      onSubmit: () => {\n        if (blockers.length) return;\n        const subject = `Broker submission | ${firstAddr} | Gross ${this.gbp(k.gross)}`;\n        const a = document.createElement('a');\n        a.href = `mailto:${C.submitEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(this.quoteText(k, true))}`;\n        document.body.appendChild(a); a.click(); a.remove();\n        this.setState({ submitted: true });\n      },\n      onCopySubmission: () => this.copy(`To: ${C.submitEmail}\\nSubject: Broker submission | ${firstAddr} | Gross ${this.gbp(k.gross)}\\n\\n` + this.quoteText(k, true), 'submission'),\n      onCopyEmail: () => this.copy(C.submitEmail, 'email'),\n      submitted: s.submitted,\n      forms: C.forms,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
